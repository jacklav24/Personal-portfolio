[project]
name = "jack-lavergne-portfolio"
version = "0.1.0"
description = "Jack LaVergne's personal portfolio"
requires-python = ">=3.11"
dependencies = ["flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
portfolio = "portfolio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[dependency-groups]
dev = ["pytest>=8,<10"]
